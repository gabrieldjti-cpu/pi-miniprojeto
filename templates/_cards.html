<div class="row g-4">
{% for servico in servicos %}
  <div class="col-12 col-md-6 col-lg-4">
    <article class="card service-card h-100">
      <div class="card-body d-flex flex-column">
        <div class="d-flex justify-content-between align-items-center gap-2 mb-4"><span class="service-number">{{ '%02d'|format(servico.id) }}</span>{% if servico.destaque %}<span class="badge rounded-pill">Em destaque</span>{% endif %}</div>
        <p class="eyebrow">{{ servico.categoria }}</p>
        <h3 class="h4">{{ servico.nome }}</h3>
        <p class="card-text flex-grow-1">{{ servico.descricao }}</p>
        <a class="text-link" href="{{ url_for('contato') }}">Informações de contato <span aria-hidden="true">↗</span></a>
      </div>
    </article>
  </div>
{% else %}
  <div class="col-12"><p class="empty-state">Nenhum serviço disponível no momento. Consulte novamente mais tarde.</p></div>
{% endfor %}
</div>
